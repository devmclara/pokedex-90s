<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex 90s: Pokémon das gerações I a III</title>
  <meta name="description" content="Pokédex feita com HTML, CSS e JavaScript puro, consumindo a PokéAPI em tempo real.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c8282d' stroke='%231b1d2a' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%231b1d2a' stroke-width='6'/%3E%3Cpath d='M4 50a46 46 0 0 0 92 0z' fill='%23f2f2f2'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%23f2f2f2' stroke='%231b1d2a' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#catalogo">Ir para o catálogo</a>

  <header class="shell">
    <div class="shell__lights" aria-hidden="true">
      <span class="lens"></span>
      <span class="dot dot--red"></span>
      <span class="dot dot--yellow"></span>
      <span class="dot dot--green"></span>
    </div>

    <div class="shell__body">
      <div class="intro">
        <h1 class="title">Pokédex 90s</h1>
        <p class="lead">
          Os Pokémon das gerações I, II e III, de Pikachu a Deoxys. Os dados chegam ao vivo da PokéAPI
          cada vez que você abre a página.
        </p>
      </div>

      <!-- Preenchido pelo JavaScript: Pokémon sorteado em tempo real -->
      <section class="screen" id="destaque" aria-labelledby="destaque-titulo" aria-live="polite">
        <h2 class="screen__heading" id="destaque-titulo">Pokémon sorteado agora</h2>
        <div class="screen__content" id="destaque-conteudo">
          <p class="screen__msg">Consultando a PokéAPI...</p>
        </div>
      </section>
    </div>
  </header>

  <main id="catalogo" class="catalog">
    <form class="toolbar" id="filtros" role="search" autocomplete="off">
      <div class="field field--grow">
        <label for="busca">Buscar por nome ou número</label>
        <input id="busca" type="search" placeholder="Ex.: charmander ou 25" maxlength="30">
      </div>

      <div class="field">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos os tipos</option>
        </select>
      </div>

      <button type="button" class="chip" id="btn-favoritos" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2 0 3.4 1.1 4.2 2.4h3.6C14.6 6.1 16 5 18 5c3.4 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>
        Favoritos <span id="contador-fav" class="chip__count">0</span>
      </button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- Os cards são criados 100% pelo JavaScript -->
    <div class="grid" id="grid"></div>

    <div class="more">
      <button type="button" class="btn" id="btn-mais" hidden>Carregar mais Pokémon</button>
    </div>
  </main>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo"></dialog>

  <footer class="footer">
    <p>
      Dados da <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a>.
      Projeto acadêmico de Web Development Front-End.
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
